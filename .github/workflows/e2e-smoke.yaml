# Browser smoke job (CR-OPS-01, CR-A11Y-09): boots the app in headless Chrome
# through shinytest2, checks one conditionalPanel and runs axe-core on the
# Overview and Step 2 screens (tests/e2e/smoke.R).
#
# Non-blocking for now: continue-on-error keeps a failure here from failing the
# pull request. Make it required (remove continue-on-error and add the job to
# branch protection) once it has been stable for a few runs. The script fails
# on serious or critical axe violations (WISEAPP_AXE_FAIL=1).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: e2e-smoke

permissions: read-all

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      WISEAPP_AXE_FAIL: "1"
      WISEAPP_E2E_OUT: ${{ runner.temp }}/e2e-out
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2 any::jsonlite any::pkgload
          needs: check

      # chromote finds the Chrome that ships with the runner image.
      - name: Smoke test
        shell: bash
        run: Rscript tests/e2e/smoke.R

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: ignore
